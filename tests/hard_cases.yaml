# Hard-case set. PUBLIC examples from the problem statement + clearly labelled SYNTHETIC
# look-alikes written for this repo (NOT taken from the proprietary training data).
# expect_*: exact code asserted (only where the statement gives it).
# plaus_icd_prefix / plaus_snomed_words: plausibility-only assertions (statement gives no code).
- id: htn
  source: statement
  entity: HTN
  chunk_text: "Assessment: HTN, continue lisinopril."
  expect_icd: I10
  expect_snomed: "59621000"
  # statement-vs-data conflict: training labels map "hypertension" and "htn (hypertension)" to SNOMED
  # 38341003; training labels win for the model, so the SNOMED code is checked for plausibility only.
  conflict: snomed
  plaus_snomed_words: [hypertens]
- id: essential_htn_well_controlled
  source: statement
  entity: essential HTN, well controlled
  chunk_text: "PMH: essential HTN, well controlled on amlodipine."
  expect_icd: I10
  expect_snomed: "59621000"
